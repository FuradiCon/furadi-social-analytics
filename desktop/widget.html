<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Furadi Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/docs/styles.css" />
<link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div class="rail-inner">
    <div class="rail-brand">
      <span class="rail-brand-text">
        <button id="dashboardLink" class="widget-brand-btn" type="button" title="Open the dashboard">Furadi</button>
        <span>Social analytics</span>
      </span>
      <button id="pinToggle" class="widget-pin-btn" type="button" aria-pressed="false" title="Keep on top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 17v5" />
          <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
        </svg>
      </button>
    </div>

    <p class="rail-label">Accounts</p>
    <nav class="channel-tabs" id="channelTabs" role="tablist" aria-label="Accounts"></nav>

    <div class="widget-opacity-row">
      <label for="opacitySlider" class="rail-label widget-opacity-label">Opacity</label>
      <input type="range" id="opacitySlider" class="widget-opacity-slider" min="15" max="100" step="5" aria-label="Panel opacity" />
    </div>

    <p class="rail-foot">
      Last built<br />
      <span class="mono" id="generatedAt">—</span>
    </p>
  </div>

  <script src="/docs/rail.js"></script>
  <script src="widget.js"></script>
</body>
</html>
